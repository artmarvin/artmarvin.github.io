<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor — pdfa-creator</title>
    <meta name="description" content="Editor PDF/A gratuito nel browser: impagina testo, forme e immagini ed esporta PDF/A-2b valido. Niente upload." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="./assets/editor-C0L3D8ez.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/ads-DU0uOVq-.js">
    <link rel="stylesheet" crossorigin href="./assets/editor-C9SneKVC.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" title="Pagina iniziale">pdfa<span>·</span>creator</a>
      <div class="group">
        <button id="undo" class="icon" title="Annulla (Ctrl+Z)" disabled>↶</button>
        <button id="redo" class="icon" title="Ripeti (Ctrl+Shift+Z)" disabled>↷</button>
      </div>
      <div class="group">
        <button id="zoom-out" class="icon" title="Riduci">−</button>
        <select id="zoom" title="Zoom">
          <option value="fit">Adatta</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
        <button id="zoom-in" class="icon" title="Ingrandisci">+</button>
      </div>
      <label class="field">
        Formato
        <select id="pagesize">
          <option value="A4">A4</option>
          <option value="A5">A5</option>
          <option value="Letter">Letter</option>
        </select>
      </label>
      <label class="field check" title="Mostra i margini e aggancia gli oggetti a bordi, margini e centro">
        <input type="checkbox" id="guides" checked /> Guide
      </label>
      <div class="spacer"></div>
      <button id="new-doc" class="ghost">Nuovo</button>
      <button id="open-json" class="ghost">Apri</button>
      <button id="save-json" class="ghost">Salva</button>
      <button id="export-pdf">Esporta PDF</button>
      <button id="export-pdfa" class="primary">Esporta PDF/A</button>
    </header>

    <div class="app">
      <aside class="toolbar">
        <button data-tool="select" class="tool active" title="Seleziona (V)">↖</button>
        <button data-tool="text" class="tool" title="Testo (T)">T</button>
        <button data-tool="rect" class="tool" title="Rettangolo (R)">▭</button>
        <button data-tool="ellipse" class="tool" title="Ellisse (E)">◯</button>
        <button data-tool="line" class="tool" title="Linea (L)">╱</button>
        <button data-tool="image" class="tool" title="Immagine (I)">▣</button>
      </aside>

      <aside class="pages">
        <div class="panel-title">Pagine</div>
        <div id="page-list"></div>
        <div class="page-actions">
          <button id="page-add" title="Aggiungi pagina dopo questa">+ Pagina</button>
          <button id="page-dup" class="icon" title="Duplica pagina">⧉</button>
          <button id="page-up" class="icon" title="Sposta su">↑</button>
          <button id="page-down" class="icon" title="Sposta giù">↓</button>
          <button id="page-del" class="icon danger" title="Elimina pagina">✕</button>
        </div>
      </aside>

      <main id="canvas-wrap">
        <div id="canvas-pad"><canvas id="c"></canvas></div>
      </main>

      <aside class="side">
        <section>
          <div class="panel-title">Proprietà</div>
          <div id="props-empty" class="muted">Seleziona un oggetto.</div>
          <div id="props-multi" class="muted" hidden></div>
          <div id="props" hidden>
            <div class="grid4">
              <label>X <input type="number" step="0.5" data-prop="x" /></label>
              <label>Y <input type="number" step="0.5" data-prop="y" /></label>
              <label>L <input type="number" step="0.5" min="1" data-prop="w" /></label>
              <label>A <input type="number" step="0.5" min="1" data-prop="h" /></label>
            </div>
            <div class="unit">misure in mm</div>
            <div class="grid2">
              <label>Rotazione° <input type="number" step="1" data-prop="angle" /></label>
              <label>Opacità % <input type="number" step="5" min="0" max="100" data-prop="opacity" /></label>
            </div>
            <div class="row" data-for="shape">
              <label class="color">Riemp. <input type="color" data-prop="fill" /></label>
              <label class="check"><input type="checkbox" data-prop="nofill" /> nessuno</label>
            </div>
            <div class="row" data-for="stroke">
              <label class="color">Bordo <input type="color" data-prop="stroke" /></label>
              <label>spess. <input type="number" step="0.5" min="0" data-prop="strokeWidth" class="short" /></label>
            </div>
            <div data-for="text">
              <div class="row">
                <select data-prop="fontFamily">
                  <option>Lato</option>
                  <option>PT Serif</option>
                  <option>PT Mono</option>
                </select>
                <label><input type="number" step="0.5" min="4" data-prop="fontSize" class="short" /> pt</label>
              </div>
              <div class="row">
                <button class="icon toggle" data-toggle="bold" title="Grassetto (Ctrl+B)"><b>B</b></button>
                <button class="icon toggle" data-toggle="italic" title="Corsivo (Ctrl+I)"><i>I</i></button>
                <button class="icon toggle" data-toggle="underline" title="Sottolineato (Ctrl+U)"><u>U</u></button>
                <button class="icon toggle" data-toggle="linethrough" title="Barrato"><s>S</s></button>
                <span class="sep-v"></span>
                <button class="icon toggle" data-align="left" title="Allinea a sinistra">⇤</button>
                <button class="icon toggle" data-align="center" title="Centra">↔</button>
                <button class="icon toggle" data-align="right" title="Allinea a destra">⇥</button>
              </div>
              <div class="row">
                <label class="color">Colore <input type="color" data-prop="textColor" /></label>
                <label>Interl. <input type="number" step="0.05" min="0.5" data-prop="lineHeight" class="short" /></label>
              </div>
            </div>
          </div>

          <div id="arrange" hidden>
            <div class="panel-sub">Allinea alla pagina</div>
            <div class="row">
              <button class="icon" data-alignpage="left" title="Sinistra">⇤</button>
              <button class="icon" data-alignpage="hcenter" title="Centro orizzontale">↔</button>
              <button class="icon" data-alignpage="right" title="Destra">⇥</button>
              <button class="icon" data-alignpage="top" title="Alto">⤒</button>
              <button class="icon" data-alignpage="vcenter" title="Centro verticale">↕</button>
              <button class="icon" data-alignpage="bottom" title="Basso">⤓</button>
            </div>
            <div class="panel-sub">Disposizione</div>
            <div class="row">
              <button class="icon" id="z-front" title="Porta in primo piano (Ctrl+Shift+])">⤒</button>
              <button class="icon" id="z-up" title="Porta avanti (Ctrl+])">↑</button>
              <button class="icon" id="z-down" title="Porta indietro (Ctrl+[)">↓</button>
              <button class="icon" id="z-back" title="Porta in fondo (Ctrl+Shift+[)">⤓</button>
              <span class="sep-v"></span>
              <button class="icon" id="dup" title="Duplica (Ctrl+D)">⧉</button>
              <button class="icon danger" id="delete" title="Elimina (Canc)">🗑</button>
            </div>
          </div>
        </section>

        <section class="layers-section">
          <div class="panel-title">Livelli</div>
          <ul id="layers"></ul>
        </section>

        <div class="ad-slot ad-side" data-ad="editor-side" hidden></div>
      </aside>
    </div>

    <footer class="statusbar">
      <span id="status">Pronto</span>
      <span class="spacer"></span>
      <span id="pageinfo"></span>
      <span id="count">0 oggetti</span>
      <a class="foot-link" href="./privacy.html" target="_blank">Privacy</a>
    </footer>

    <input type="file" id="file-image" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
    <input type="file" id="file-json" accept="application/json,.json" hidden />

  </body>
</html>
