<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strumenti gratuiti nel browser</title>
    <meta name="description" content="Strumenti web gratuiti che funzionano interamente nel browser: niente upload, niente account." />
    <link rel="canonical" href="https://artmarvin.github.io/" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 17px/1.6 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #1c1e21; }
      main { max-width: 860px; margin: 0 auto; padding: 56px 20px; }
      h1 { font-size: clamp(30px, 4.4vw, 42px); line-height: 1.15; margin: 0 0 14px; color: #111827; }
      .lead { color: #4b5563; font-size: 19px; margin: 0 0 40px; }
      .tool { display: block; padding: 24px; border: 1px solid #e5e7eb; border-radius: 14px; text-decoration: none; color: inherit; background: #f9fafb; }
      .tool:hover { border-color: #1a56db; box-shadow: 0 6px 20px rgba(26,86,219,.12); }
      .tool h2 { margin: 0 0 6px; font-size: 22px; color: #1a56db; }
      .tool p { margin: 0; color: #4b5563; }
      footer { text-align: center; color: #6b7280; font-size: 15px; padding: 28px 16px; border-top: 1px solid #e5e7eb; }
      footer a { color: #4b5563; }
    </style>
  </head>
  <body>
    <main>
      <h1>Strumenti gratuiti, nel tuo browser</h1>
      <p class="lead">Ogni strumento funziona interamente sul tuo dispositivo: i tuoi file non vengono caricati da nessuna parte e non serve un account.</p>
      <a class="tool" href="./pdfa-creator/">
        <h2>pdfa-creator</h2>
        <p>Impagina testo, forme e immagini ed esporta documenti PDF/A-2b validi per l'archiviazione.</p>
      </a>
    </main>
    <footer>
      <a href="./pdfa-creator/privacy.html">Privacy e cookie</a>
    </footer>
  </body>
</html>
